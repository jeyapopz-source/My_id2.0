name: Build MY ID APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true

      - name: Extract MY ID ZIP if present
        shell: bash
        run: |
          echo "Checking repository..."

          if find . -maxdepth 1 -type f -name "*.zip" | grep -q .; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

            echo "ZIP found:"
            echo "$ZIP_FILE"

            mkdir -p extracted_project
            unzip -o "$ZIP_FILE" -d extracted_project
          else
            echo "No ZIP found. Using repository files."
          fi

      - name: Find Flutter project
        shell: bash
        run: |
          echo "Searching for pubspec.yaml..."

          PUBSPEC=$(find . \
            -type f \
            -name "pubspec.yaml" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            echo "This repository does not contain a Flutter project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Flutter Pub Get
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Flutter Analyze
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter analyze || true

      - name: Build Release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output

          cp "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk" \
             output/MY_ID_release.apk

          echo "APK successfully created:"
          ls -lh output/MY_ID_release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MY_ID_release_APK
          path: output/MY_ID_release.apk
          if-no-files-found: error
          retention-days: 30
